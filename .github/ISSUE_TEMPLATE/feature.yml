name: Feature
description: Define an approved, traceable TruckCMS product change
title: "[Feature] "
projects: ["jedt3d/8"]
body:
  - type: markdown
    attributes:
      value: |
        This form targets [TruckCMS Project 8](https://github.com/users/jedt3d/projects/8). GitHub adds the issue automatically when the author has project write access.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or product problem, not only the proposed implementation.
      placeholder: What is wrong or missing, and who is affected?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result when this feature is complete.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: PRD alignment
      description: List affected REQ identifiers and launch gates, or explain why none apply.
      placeholder: |
        - REQ-XX
        - Launch gate: ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide objective, testable completion conditions.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Identify adjacent work that this ticket must not include.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Describe the automated and manual evidence expected in the pull request.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: List blocked decisions, dependencies, migrations, security concerns, or compatibility risks.
